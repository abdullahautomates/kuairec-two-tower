description = "A two-tower video retrieval model on the KuaiRec dataset, tested against popularity and a counting baseline"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "torch>=2.15.0",
]
